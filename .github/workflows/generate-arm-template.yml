name: Generate ARM Template

on:
  push:
    branches:
      - master
    paths:
      - '**/*.bicep'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:                # Job-level permissions configuration starts here
      contents: write           # 'write' access to repository contents

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: true # we persist credentials, so we can push the generated ARM template

    - name: Generate ARM template
      run: az bicep build --file azuredeploy.bicep

    - name: Commit and push generated ARM template
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add azuredeploy.json
        git commit -m 'Generate ARM template from Bicep'
        git push

  check-arm-template:
    needs: build-and-push
    uses: $/.github/workflows/check-arm-template.yml
